<div class="color-picker-wrapper">
  <button class="trigger-btn" (click)="togglePopover()" title="Alterar Tema" [class.active]="isOpen()">
    <span class="material-symbols-outlined">auto_awesome</span>
  </button>

  <div class="popover-panel neumorphic-card" *ngIf="isOpen()" [class.fade-out]="isClosing()">
    <h4>Choose a theme</h4>
    <div class="color-options-grid">
      <button *ngFor="let color of availableColors()" class="color-option-btn"
        [class.selected]="color.id === currentTheme().selectedColor.id" [style.background]="color.gradient"
        (click)="selectColor(color)" [title]="color.name">
        <span class="check-mark" *ngIf="color.id === currentTheme().selectedColor.id">✓</span>
      </button>
    </div>
  </div>
</div>
