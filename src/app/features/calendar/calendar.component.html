<div class="calendar-wrapper">

  <div class="calendar-controls">

    <div class="dropdown-container">
      <button class="neumorphic-pill" (click)="toggleMonthDropdown()" [class.active]="isMonthDropdownOpen()">
        <span>{{ calendarService.months[calendarService.selectedDate().getMonth()] }}</span>
        <span class="material-symbols-outlined dropdown-arrow">expand_more</span>
      </button>

      <div class="dropdown-menu neumorphic-card" *ngIf="isMonthDropdownOpen()"
        [class.fade-out]="isMonthDropdownClosing()">
        <button *ngFor="let month of calendarService.months; let i = index" class="dropdown-item"
          [class.selected]="i === calendarService.selectedDate().getMonth()" (click)="selectMonth(i)">
          {{ month }}
        </button>
      </div>
    </div>

    <div class="dropdown-container">
      <button class="neumorphic-pill" (click)="toggleYearDropdown()" [class.active]="isYearDropdownOpen()">
        <span>{{ calendarService.selectedDate().getFullYear() }}</span>
        <span class="material-symbols-outlined dropdown-arrow">expand_more</span>
      </button>

      <div class="dropdown-menu neumorphic-card year-menu" *ngIf="isYearDropdownOpen()"
        [class.fade-out]="isYearDropdownClosing()">
        <button *ngFor="let year of calendarService.years" class="dropdown-item"
          [class.selected]="year === calendarService.selectedDate().getFullYear()" (click)="selectYear(year)">
          {{ year }}
        </button>
      </div>

    </div>
  </div>

  <div class="calendar-card neumorphic-card">

    <div class="weekdays-grid">
      <div *ngFor="let day of weekDays" class="weekday-header">
        {{ day }}
      </div>
    </div>

    <div class="days-grid">
      <div *ngFor="let day of calendarService.calendarDays()" class="day-cell" [class.other-month]="!day.isCurrentMonth"
        [class.today]="day.isToday">

        <span class="day-number">{{ formatDayNumber(day.dayNumber) }}</span>

        <span class="today-dot" *ngIf="day.isToday"></span>
        <span class="holiday-dot" *ngIf="day.isHoliday && !day.isToday"></span>

        <div class="holiday-tooltip" *ngIf="day.isHoliday && day.holidayName">
          {{ day.holidayName }}
        </div>

      </div>

    </div>
  </div>
</div>
