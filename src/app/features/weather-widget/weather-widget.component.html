<div class="weather-container">
  <!-- Pílula Resumida (Sob o Relógio) -->
  <button class="weather-summary-pill neumorphic-btn" (click)="toggleForecast()" [class.active]="isOpen()"
    aria-label="Toggle weather forecast">

    <div class="weather-icon">
      {{ weatherService.weatherData()?.icon || '☀️' }}
    </div>

    <div class="weather-temp">
      {{ weatherService.weatherData()?.temperature ?? 0 }}°
    </div>

    <div class="weather-details">
      <span class="condition">
        {{ weatherService.weatherData()?.condition || 'Loading...' }}
      </span>
      <span class="city">
        {{ weatherService.weatherData()?.city || 'São Paulo...' }}
      </span>
    </div>
  </button>

  <!-- Painel de Previsão 24h (Expansível ao Lado) -->
  <div class="forecast-panel neumorphic-card" *ngIf="isOpen()" [class.fade-out]="isClosing()">

    <div class="forecast-header">TODAY'S FORECAST (24H)</div>

    <div class="forecast-list">
      <div class="forecast-item" *ngFor="let item of weatherService.weatherData()?.hourly">
        <span class="forecast-time">{{ item.time }}</span>
        <span class="forecast-icon">{{ item.icon }}</span>
        <span class="forecast-temp">{{ item.temp }}°</span>
      </div>
    </div>
  </div>
</div>
