<div class="weather-container">
  <button class="weather-summary-pill neumorphic-btn" (click)="toggleForecast()" [class.active]="isExpanded()"
    aria-label="Toggle weather forecast">

    <div class="weather-icon">{{ weatherData().icon }}</div>
    <div class="weather-temp">{{ weatherData().temperature }}°</div>
    <div class="weather-details">
      <span class="condition">{{ weatherData().condition }}</span>
      <span class="city">{{ weatherData().city }}</span>
    </div>
  </button>

  <div class="forecast-panel neumorphic-card" *ngIf="isExpanded()">
    <div class="forecast-header">TODAY'S FORECAST</div>
    <div class="forecast-list">
      <div class="forecast-item" *ngFor="let item of weatherData().hourly">
        <span class="forecast-time">{{ item.time }}</span>
        <span class="forecast-icon">{{ item.icon }}</span>
        <span class="forecast-temp">{{ item.temp }}°</span>
      </div>
    </div>
  </div>
</div>
